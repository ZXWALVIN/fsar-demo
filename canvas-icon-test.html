<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Canvas Icon Test</title>
    <style>
        body {
            background: #0d0f14;
            color: #fff;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        canvas {
            border: 2px solid #00d4ff;
            margin: 20px 0;
            cursor: pointer;
        }
        .tooltip-card {
            position: fixed;
            width: 320px;
            background: rgba(26, 29, 41, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .tooltip-card.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .tooltip-header {
            font-size: 12px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .tooltip-content {
            font-size: 10px;
            line-height: 1.6;
            color: rgba(224, 230, 237, 0.85);
        }
    </style>
</head>
<body>
    <h1>Canvas 图标点击测试</h1>
    <p>点击 Canvas 上的橙色圆形图标（带问号）</p>

    <canvas id="testCanvas" width="800" height="200"></canvas>

    <div id="tooltip-test" class="tooltip-card">
        <div class="tooltip-header">⚠️ 测试 Tooltip</div>
        <div class="tooltip-content">
            <p><strong>成功！</strong>你点击了 Canvas 上的图标。</p>
            <p>这个卡片会在 5 秒后自动消失。</p>
        </div>
    </div>

    <div id="log" style="margin-top: 20px; font-family: monospace; font-size: 12px;"></div>

    <script>
        const canvas = document.getElementById('testCanvas');
        const ctx = canvas.getContext('2d');
        const tooltip = document.getElementById('tooltip-test');
        const log = document.getElementById('log');

        function addLog(msg) {
            log.innerHTML += `<p style="color:#2ecc71;">[${new Date().toLocaleTimeString()}] ${msg}</p>`;
        }

        // 绘制测试场景
        function draw() {
            // 背景
            ctx.fillStyle = '#0f0f23';
            ctx.fillRect(0, 0, 800, 200);

            // 道路
            ctx.fillStyle = '#2c3e50';
            ctx.fillRect(0, 50, 800, 100);

            // 冲突区
            ctx.fillStyle = 'rgba(243, 156, 18, 0.3)';
            ctx.fillRect(300, 50, 200, 100);

            // 绘制图标
            const iconX = 400;
            const iconY = 100;

            // 图标背景圆
            ctx.fillStyle = 'rgba(243, 156, 18, 0.9)';
            ctx.beginPath();
            ctx.arc(iconX, iconY, 12, 0, Math.PI * 2);
            ctx.fill();

            // 图标边框
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 问号
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', iconX, iconY);

            // 提示文字
            ctx.fillStyle = '#00d4ff';
            ctx.font = '12px Arial';
            ctx.textAlign = 'left';
            ctx.fillText('← 点击这个图标', iconX + 20, iconY);

            addLog('Canvas 绘制完成，图标位置: (400, 100)');
        }

        // 点击检测
        canvas.addEventListener('click', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            addLog(`点击位置: (${x.toFixed(0)}, ${y.toFixed(0)})`);

            // 图标位置
            const iconX = 400;
            const iconY = 100;

            const distance = Math.sqrt((x - iconX) ** 2 + (y - iconY) ** 2);
            addLog(`距离图标中心: ${distance.toFixed(2)} 像素`);

            if (distance < 15) {
                addLog('✅ 点击命中！显示 Tooltip');

                tooltip.style.left = (rect.left + x + 20) + 'px';
                tooltip.style.top = (rect.top + y - 50) + 'px';
                tooltip.classList.add('visible');

                setTimeout(() => {
                    tooltip.classList.remove('visible');
                    addLog('Tooltip 已隐藏');
                }, 5000);
            } else {
                addLog('❌ 点击未命中，请点击橙色圆圈');
            }
        });

        // 鼠标移动显示坐标
        canvas.addEventListener('mousemove', function(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            canvas.title = `坐标: (${x.toFixed(0)}, ${y.toFixed(0)})`;
        });

        draw();
        addLog('测试页面加载完成');
    </script>
</body>
</html>
