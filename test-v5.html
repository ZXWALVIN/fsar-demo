<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>v5.0-L Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1d29;
            color: #e0e6ed;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #00d4ff;
            border-radius: 5px;
        }
        .info-icon {
            display: inline-block;
            width: 14px;
            height: 14px;
            line-height: 14px;
            text-align: center;
            border-radius: 50%;
            border: 1px solid rgba(0, 212, 255, 0.6);
            color: #00d4ff;
            font-size: 10px;
            font-weight: bold;
            cursor: help;
            margin-left: 4px;
        }
        .tooltip-card {
            position: fixed;
            width: 320px;
            background: rgba(26, 29, 41, 0.98);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 212, 255, 0.5);
            border-radius: 8px;
            padding: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
        }
        .tooltip-card.visible {
            opacity: 1;
            pointer-events: auto;
        }
        .tooltip-header {
            font-size: 12px;
            font-weight: 600;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .tooltip-content {
            font-size: 10px;
            line-height: 1.6;
            color: rgba(224, 230, 237, 0.85);
        }
    </style>
</head>
<body>
    <h1>v5.0-L 功能测试</h1>

    <div class="test-section">
        <h2>1. Tooltip 测试</h2>
        <p>鼠标悬停在问号图标上应该显示悬浮卡片：<span class="info-icon" id="test-icon">?</span></p>
    </div>

    <div id="test-tooltip" class="tooltip-card">
        <div class="tooltip-header">测试 Tooltip</div>
        <div class="tooltip-content">
            <p>如果你能看到这个卡片，说明 Tooltip 系统工作正常！</p>
        </div>
    </div>

    <div class="test-section">
        <h2>2. 配置检查</h2>
        <div id="config-check"></div>
    </div>

    <script>
        // 测试 Tooltip
        const icon = document.getElementById('test-icon');
        const tooltip = document.getElementById('test-tooltip');

        icon.addEventListener('mouseenter', function(e) {
            const iconRect = icon.getBoundingClientRect();
            tooltip.style.left = (iconRect.right + 10) + 'px';
            tooltip.style.top = (iconRect.top - 50) + 'px';
            tooltip.classList.add('visible');
        });

        icon.addEventListener('mouseleave', function() {
            setTimeout(() => {
                tooltip.classList.remove('visible');
            }, 100);
        });

        // 检查配置
        const configCheck = document.getElementById('config-check');
        configCheck.innerHTML = `
            <p>✅ Tooltip 图标已加载</p>
            <p>✅ Tooltip 卡片已加载</p>
            <p>✅ JavaScript 正常执行</p>
        `;
    </script>
</body>
</html>
